<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07504d">
  <link rel="icon" type="image/x-icon" href="logo.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Cadastro de Colaboradores</title>

  <style>
    :root {
      --accent: #0b6e69;
      --accent-dark: #07504d;
      --ink: #14201f;
      --muted: #647371;
      --line: #d9e4e2;
      --surface: #ffffff;
      --danger: #b42318;
      --success: #137333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 20px;
      color: var(--ink);
      font-family: "Manrope", "Segoe UI", Arial, sans-serif;
      background:
        linear-gradient(135deg, rgba(7, 80, 77, 0.88), rgba(19, 115, 51, 0.55)),
        url('fundo.jpg') center / cover fixed;
    }

    .container {
      width: 100%;
      max-width: 760px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 24px 70px rgba(5, 42, 40, 0.3);
      backdrop-filter: blur(10px);
    }

    .intro {
      padding: 34px 40px 30px;
      color: #fff;
      background: linear-gradient(115deg, var(--accent-dark), var(--accent));
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 26px;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.16);
      font-size: 15px;
    }

    .eyebrow {
      margin-bottom: 12px;
      color: #a8e2d9;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 440px;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .subtitle {
      max-width: 520px;
      margin-top: 12px;
      color: #d8f2ee;
      line-height: 1.55;
    }

    form { padding: 30px 40px 36px; }

    .form-heading {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      margin-bottom: 24px;
    }

    .form-heading h2 { font-size: 18px; }
    .required-note { color: var(--muted); font-size: 12px; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 16px;
    }

    .field { display: flex; flex-direction: column; gap: 7px; }
    .field.full { grid-column: 1 / -1; }

    label { color: var(--ink); font-size: 14px; font-weight: 700; }

    input, select {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input::placeholder { color: #9aa8a6; }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(11, 110, 105, 0.14);
    }

    .turno-menu { position: relative; }

    .turno-menu summary {
      display: flex;
      min-height: 46px;
      align-items: center;
      justify-content: space-between;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      list-style: none;
    }

    .turno-menu summary::-webkit-details-marker { display: none; }
    .turno-menu summary::after { content: "▾"; color: var(--accent); font-size: 16px; }
    .turno-menu[open] summary { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(11, 110, 105, 0.14); }
    .turno-menu[open] summary::after { content: "▴"; }

    .turno-options {
      position: absolute;
      z-index: 2;
      top: calc(100% + 6px);
      right: 0;
      left: 0;
      display: grid;
      gap: 4px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 24px rgba(20, 32, 31, 0.14);
    }

    .turno-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 6px;
      color: var(--ink);
      cursor: pointer;
      font-size: 14px;
    }

    .turno-option:hover { background: #eef8f6; }
    .turno-option input { width: 17px; min-height: 17px; accent-color: var(--accent); }

    .hint { color: var(--muted); font-size: 12px; }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 26px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: background 160ms ease, transform 160ms ease;
    }

    button:hover { background: var(--accent-dark); transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: 0.7; transform: none; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 170px;
      gap: 12px;
      align-items: center;
    }

    .actions button { margin-top: 26px; }

    .secondary-button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--accent-dark);
    }

    .secondary-button:hover { border-color: var(--accent); background: #eef8f6; }

    .msg {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .msg.success { background: #e8f5e9; color: var(--success); }
    .msg.err { background: #fff0ee; color: var(--danger); }

    footer { margin-top: 18px; color: rgba(255, 255, 255, 0.82); font-size: 13px; }

    @media (max-width: 600px) {
      body { padding: 18px 12px; }
      .intro, form { padding-left: 22px; padding-right: 22px; }
      .form-grid { grid-template-columns: 1fr; gap: 17px; }
      .field.full { grid-column: auto; }
      .form-heading { display: block; }
      .required-note { display: block; margin-top: 5px; }
      .actions { grid-template-columns: 1fr; gap: 0; }
      .actions .secondary-button { order: 2; margin-top: 10px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="intro">
      <div class="brand"><span class="brand-mark" aria-hidden="true">S</span> SEMAC</div>
      <p class="eyebrow">SEMAC • Gestão de pessoas</p>
      <h1>Cadastro de colaboradores</h1>
    </header>

    <form id="formCadastro" novalidate>
      <div class="form-heading">
        <h2>Dados do colaborador</h2>
        <span class="required-note">Todos os campos são obrigatórios</span>
      </div>

      <div class="form-grid">
        <div class="field full">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" autocomplete="name" minlength="3" required>
        </div>

        <div class="field">
          <label for="matricula">Matrícula</label>
          <input id="matricula" name="matricula" type="text" inputmode="numeric" pattern="\d{4,11}" minlength="4" maxlength="11" autocomplete="off" required placeholder="4 a 11 dígitos">
          <span class="hint">Use somente números.</span>
        </div>

        <div class="field">
          <label for="cargo">Cargo</label>
          <details id="cargoMenu" class="turno-menu">
            <summary id="cargoSummary">Selecione o cargo</summary>
            <div class="turno-options" aria-label="Opções de cargo">
              <label class="turno-option"><input type="radio" name="cargo" value="Serviços Gerais">Serviços Gerais</label>
              <label class="turno-option"><input type="radio" name="cargo" value="Design">Design</label>
              <label class="turno-option"><input type="radio" name="cargo" value="Mídia">Mídia</label>
              <label class="turno-option"><input type="radio" name="cargo" value="Edição de Mídia">Edição de Mídia</label>
              <label class="turno-option"><input type="radio" name="cargo" value="Redes Sociais">Redes Sociais</label>
              <label class="turno-option"><input type="radio" name="cargo" value="Even3">Even3</label>
            </div>
          </details>
        </div>

        <div class="field">
          <label for="turno">Turno</label>
          <details id="turnoMenu" class="turno-menu">
            <summary id="turnoSummary">Selecione os turnos</summary>
            <div class="turno-options" aria-label="Opções de turno">
              <label class="turno-option"><input type="checkbox" name="turno" value="Manhã">Manhã</label>
              <label class="turno-option"><input type="checkbox" name="turno" value="Tarde">Tarde</label>
              <label class="turno-option"><input type="checkbox" name="turno" value="Noite">Noite</label>
            </div>
          </details>
          <span id="turnoHint" class="hint">Selecione um ou mais turnos.</span>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="seu@exemplo.com">
        </div>
      </div>

      <div class="actions">
        <button id="submitButton" type="submit">Cadastrar colaborador</button>
        <button id="clearButton" class="secondary-button" type="reset">Limpar campos</button>
      </div>
      <p id="msg" class="msg" role="status" aria-live="polite" hidden></p>
    </form>
  </main>

  <footer>Criado por CLX</footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      query,
      where,
      getDocs,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCpBiFzqOod4K32cWMr5hfx13fw6LGcPVY",
      authDomain: "ponto-eletronico-f35f9.firebaseapp.com",
      projectId: "ponto-eletronico-f35f9",
      storageBucket: "ponto-eletronico-f35f9.firebasestorage.app",
      messagingSenderId: "208638350255",
      appId: "1:208638350255:web:63d016867a67575b5e155a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const form = document.getElementById('formCadastro');
    const msgEl = document.getElementById('msg');
    const submitButton = document.getElementById('submitButton');
    const turnoMenu = document.getElementById('turnoMenu');
    const turnoSummary = document.getElementById('turnoSummary');
    const cargoMenu = document.getElementById('cargoMenu');
    const cargoSummary = document.getElementById('cargoSummary');
    let messageTimer;

    form.querySelectorAll('input[name="turno"]').forEach((checkbox) => {
      checkbox.addEventListener('change', updateTurnoSummary);
    });

    form.querySelectorAll('input[name="cargo"]').forEach((radio) => {
      radio.addEventListener('change', updateCargoSummary);
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      msgEl.hidden = true;

      const nome = form.nome.value.trim();
      const matricula = form.matricula.value.trim();
      const cargo = form.cargo.value.trim();
      const turnos = Array.from(form.querySelectorAll('input[name="turno"]:checked'), (checkbox) => checkbox.value);
      const email = form.email.value.trim().toLowerCase();

      if (!form.checkValidity() || !nome || !matricula || !cargo || !turnos.length || !email) {
        form.reportValidity();
        showMsg('Confira os campos destacados e tente novamente.', true);
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Verificando dados...';

      try {
        const colaboradores = collection(db, 'colaboradores');
        const matriculaQuery = query(colaboradores, where('matricula', '==', matricula));
        const emailQuery = query(colaboradores, where('email', '==', email));
        const [matriculaSnapshot, emailSnapshot] = await Promise.all([
          getDocs(matriculaQuery),
          getDocs(emailQuery)
        ]);

        if (!matriculaSnapshot.empty) {
          showMsg('Matrícula já cadastrada.', true);
          return;
        }

        if (!emailSnapshot.empty) {
          showMsg('E-mail já cadastrado.', true);
          return;
        }

        await addDoc(colaboradores, {
          nome,
          matricula,
          cargo,
          turno: turnos,
          email,
          criadoEm: serverTimestamp()
        });

        form.reset();
        showMsg('Cadastro realizado com sucesso!', false);
      } catch (error) {
        console.error(error);
        showMsg('Não foi possível concluir o cadastro. Verifique sua conexão e tente novamente.', true);
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Cadastrar colaborador';
      }
    });

    form.addEventListener('reset', () => {
      window.clearTimeout(messageTimer);
      msgEl.hidden = true;
      window.setTimeout(() => {
        updateTurnoSummary();
        updateCargoSummary();
      }, 0);
    });

    function updateTurnoSummary() {
      const selectedTurnos = Array.from(form.querySelectorAll('input[name="turno"]:checked'), (checkbox) => checkbox.value);
      turnoSummary.textContent = selectedTurnos.length ? selectedTurnos.join(', ') : 'Selecione os turnos';
      turnoSummary.style.color = selectedTurnos.length ? 'var(--ink)' : 'var(--muted)';
    }

    function updateCargoSummary() {
      const selectedCargo = form.querySelector('input[name="cargo"]:checked');
      cargoSummary.textContent = selectedCargo ? selectedCargo.value : 'Selecione o cargo';
      cargoSummary.style.color = selectedCargo ? 'var(--ink)' : 'var(--muted)';
      cargoMenu.open = false;
    }

    function showMsg(text, isError) {
      window.clearTimeout(messageTimer);
      msgEl.textContent = text;
      msgEl.className = isError ? 'msg err' : 'msg success';
      msgEl.hidden = false;
      messageTimer = window.setTimeout(() => {
        msgEl.hidden = true;
      }, 5000);
    }
  </script>
</body>
</html>
